name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy pytest pytest-cov

    - name: Run test suite with pytest
      run: |
        pytest -v --cov=synaptospike --cov-report=term-missing

    - name: Execute example simulations
      run: |
        PYTHONPATH=. python examples/cortical_column_demo.py
        PYTHONPATH=. python examples/stdp_synaptic_learning.py
        PYTHONPATH=. python examples/hodgkin_huxley_bifurcation.py

    - name: Validate CLI interface
      run: |
        PYTHONPATH=. python -m synaptospike.cli simulate --duration 30 --stimulus 10.0
        PYTHONPATH=. python -m synaptospike.cli phase-plane --regime hopf --stimulus 80.0
        PYTHONPATH=. python -m synaptospike.cli izhikevich --preset regular_spiking --duration 50
        PYTHONPATH=. python -m synaptospike.cli network --excitatory 100 --inhibitory 25 --duration 50
        PYTHONPATH=. python -m synaptospike.cli stdp --pairings 20 --delta-t 10.0
