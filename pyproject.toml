[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptospike"
version = "0.1.0"
description = "High-Performance Biophysical Neural Dynamics, Hodgkin-Huxley Conductance, Morris-Lecar Phase Plane, Izhikevich Spiking, STDP & Brunel Recurrent Network Simulation Engine in Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ZengLLQ", email = "zengllq@users.noreply.github.com"}
]
keywords = [
    "action-potential",
    "biophysics",
    "computational-neuroscience",
    "hodgkin-huxley",
    "izhikevich-model",
    "neural-dynamics",
    "python",
    "scientific-computing",
    "spiking-neural-network",
    "stdp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
synaptospike = "synaptospike.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
